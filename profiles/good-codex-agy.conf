# Семейство good-*: запасная пара, когда лучший редактор недоступен.
# Codex переводит, Opus через Antigravity редактирует — на случай исчерпанного
# Claude Code: у Antigravity свой счёт лимитов. Запасным у редактора — сам Sol.
--agent codex
--scout      gpt-5.6-sol:high
--translator gpt-5.6-sol:medium
--editor     agy:claude-opus-5-5-medium,gpt-5.6-sol:medium
# Переводчик стоит запасным редактором: свой кусок ему не давать.
--self-edit  never
--formatter  gpt-5.6-terra:high
--ocrfixer   gpt-5.6-terra:low
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel gpt-5.6-terra:high,gpt-5.6-sol:medium,local:pdftotext
--jobs 2
