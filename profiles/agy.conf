# Antigravity, всё внутри одного агента.
# Смысловые проходы — Gemini Flash и Opus: отказ у них приходится не на
# одни и те же места, и брошенный кусок подхватывается.
--agent agy
--translator gemini-3.8-flash-medium,claude-opus-5-5-medium,claude-sonnet-5-5-medium
--editor     claude-opus-5-5-medium,gemini-3.8-flash-high
--scout      gemini-3.8-flash-medium,claude-opus-5-5-medium
# Разметка и правка распознавания — работа опознавательная, и дорогая модель
# на ней не нужна. Последней в цепочке стоит модель другого происхождения:
# у неё и запреты другие, а на опознании качество слога ни при чём.
--formatter  gemini-3.8-flash-low,claude-sonnet-5-5-low,gpt-oss-120b-medium
--ocrfixer   gemini-3.8-flash-low,claude-sonnet-5-5-low,gpt-oss-120b-medium
# Модель для распознавания картинок (PDF). По умолчанию берётся основная модель агента.
--ocrmodel gemini-3.8-flash-low,claude-sonnet-5-5-low,local:pdftotext
--jobs 2
# Переводчик о трёх моделях может совпасть с редактором — самоправку
# запрещаем: кусок без чужого редактора честно остаётся неправленым.
--self-edit never
